<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La arquitectura del milagro — Tesina</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1208;overflow:hidden;height:100vh;width:100vw;user-select:none}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(255,255,255,0.03) 28px,rgba(255,255,255,0.03) 29px),repeating-linear-gradient(90deg,transparent,transparent 28px,rgba(255,255,255,0.03) 28px,rgba(255,255,255,0.03) 29px),#1a1208;pointer-events:none;z-index:0}
#presentation{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;z-index:1}
.slide-wrapper{position:absolute;width:min(90vw,155vh);max-width:1080px;aspect-ratio:4/3;display:none;align-items:center;justify-content:center}
.slide-wrapper.active{display:flex}
.tape{position:absolute;top:-16px;left:50%;width:110px;height:28px;background:rgba(196,164,114,0.5);border-radius:2px;z-index:10}
.slide-shadow{position:absolute;inset:0;border-radius:4px;box-shadow:8px 14px 45px rgba(0,0,0,0.75);pointer-events:none;z-index:0}
.slide-img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;position:relative;z-index:1}
@keyframes slideInRight{from{opacity:0;transform:translateX(70px) rotate(1.5deg)}to{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-70px) rotate(-1.5deg)}to{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.slide-wrapper.anim-right{animation:slideInRight 0.5s cubic-bezier(0.22,1,0.36,1) both}
.slide-wrapper.anim-left{animation:slideInLeft 0.5s cubic-bezier(0.22,1,0.36,1) both}
.slide-wrapper.anim-fade{animation:fadeUp 0.45s ease both}
#nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:100;background:rgba(26,18,8,0.8);backdrop-filter:blur(8px);padding:9px 18px;border-radius:50px;border:1px solid rgba(196,164,114,0.3)}
.nav-btn{width:42px;height:42px;border-radius:50%;border:2px solid rgba(196,164,114,0.55);background:transparent;color:#c4a472;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.nav-btn:hover{background:rgba(196,164,114,0.18);color:#f5f0e8}
.nav-btn:disabled{opacity:0.22;cursor:default}
#slide-counter{font-family:'Special Elite',monospace;color:#c4a472;font-size:13px;letter-spacing:2px;min-width:56px;text-align:center}
#dots{display:flex;gap:5px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(196,164,114,0.35);cursor:pointer;transition:all 0.25s;border:none}
.dot.active{background:#c4a472;transform:scale(1.4)}
.dot:hover{background:rgba(196,164,114,0.65)}
#title-bar{position:fixed;top:0;left:0;right:0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(26,18,8,0.92) 0%,transparent 100%);z-index:100}
#title-bar h1{font-family:'Special Elite',monospace;font-size:clamp(10px,1.3vw,13px);color:rgba(196,164,114,0.75);letter-spacing:1.5px;font-weight:normal;text-transform:uppercase}
#fullscreen-btn{background:transparent;border:1px solid rgba(196,164,114,0.35);color:rgba(196,164,114,0.65);padding:5px 12px;border-radius:4px;font-family:'Special Elite',monospace;font-size:11px;cursor:pointer;letter-spacing:1px;transition:all 0.2s}
#fullscreen-btn:hover{background:rgba(196,164,114,0.1);color:#c4a472}
#hint{position:fixed;bottom:76px;right:22px;font-family:'Patrick Hand',cursive;font-size:11px;color:rgba(196,164,114,0.35);transition:opacity 1s}
#progress{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#c85a7a,#b5862a,#2d7a6a);transition:width 0.4s cubic-bezier(0.22,1,0.36,1);z-index:200}
#section-label{position:fixed;top:52px;right:22px;font-family:'Patrick Hand',cursive;font-size:12px;color:rgba(196,164,114,0.5);letter-spacing:1px}
</style>
</head>
<body>

<div id="title-bar">
  <h1>La arquitectura del milagro &mdash; Lic. en Comunicaci&oacute;n Social</h1>
  <button id="fullscreen-btn" onclick="toggleFullscreen()">&#x26F6; Pantalla completa</button>
</div>
<div id="section-label"></div>
<div id="progress"></div>
<div id="presentation"></div>
<div id="nav">
  <button class="nav-btn" id="prev-btn" onclick="prevSlide()">&larr;</button>
  <div id="dots"></div>
  <span id="slide-counter">1 / 12</span>
  <button class="nav-btn" id="next-btn" onclick="nextSlide()">&rarr;</button>
</div>
<div id="hint">&larr; &rarr; navegar &nbsp;&middot;&nbsp; Espacio avanzar</div>

<script>
const IMAGES = ['1.png','2.png','3.png','13.png','14.png','15.png','16.png','4.png','5.png','6.png','7.png','8.png','9.png','10.png','11.png','12.png'];
const SECTIONS = {1:'',2:'Pregunta de investigación',3:'Objetivos',4:'Metodología',5:'Categorías de análisis',6:'Categorías 1 & 2',7:'Categorías 3 & 4',8:'Categorías 5 & 6',9:'Hallazgos y resultados',10:'Conclusiones',11:'Reflexión final',12:'¡Muchas gracias!'};
const TAPE_ANGLES = [2.1,-1.8,1.3,-2.4,0.8,-1.2,2.5,-0.9,1.7,-2.1,1.0,-1.5];
const TOTAL = 16;
let current = 1;

const presentation = document.getElementById('presentation');
const dotsContainer = document.getElementById('dots');
const counter = document.getElementById('slide-counter');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const progress = document.getElementById('progress');
const sectionLabel = document.getElementById('section-label');

IMAGES.forEach((src, idx) => {
  const i = idx + 1;
  const wrapper = document.createElement('div');
  wrapper.className = 'slide-wrapper';
  wrapper.id = 'slide-' + i;
  const shadow = document.createElement('div'); shadow.className = 'slide-shadow';
  const tape = document.createElement('div'); tape.className = 'tape';
  tape.style.transform = 'translateX(-50%) rotate(' + TAPE_ANGLES[idx] + 'deg)';
  const img = document.createElement('img');
  img.src = src; img.className = 'slide-img'; img.alt = 'Diapositiva ' + i; img.draggable = false;
  wrapper.appendChild(shadow); wrapper.appendChild(tape); wrapper.appendChild(img);
  presentation.appendChild(wrapper);
});

for (let i = 1; i <= TOTAL; i++) {
  const dot = document.createElement('button');
  dot.className = 'dot';
  const n = i;
  dot.addEventListener('click', () => goTo(n, n > current ? 'right' : 'left'));
  dotsContainer.appendChild(dot);
}

function updateUI() {
  counter.textContent = current + ' / ' + TOTAL;
  prevBtn.disabled = current === 1;
  nextBtn.disabled = current === TOTAL;
  progress.style.width = ((current / TOTAL) * 100) + '%';
  sectionLabel.textContent = SECTIONS[current] || '';
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i + 1 === current));
}

function goTo(n, dir) {
  if (n === current || n < 1 || n > TOTAL) return;
  document.getElementById('slide-' + current).classList.remove('active','anim-right','anim-left','anim-fade');
  current = n;
  document.getElementById('slide-' + current).classList.add('active', dir === 'right' ? 'anim-right' : dir === 'left' ? 'anim-left' : 'anim-fade');
  updateUI();
}

function nextSlide() { if (current < TOTAL) goTo(current + 1, 'right'); }
function prevSlide() { if (current > 1) goTo(current - 1, 'left'); }

document.getElementById('slide-1').classList.add('active','anim-fade');
updateUI();

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();nextSlide();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prevSlide();}
  else if(e.key==='Home') goTo(1,'left');
  else if(e.key==='End') goTo(TOTAL,'right');
  else if(e.key==='f'||e.key==='F') toggleFullscreen();
});

let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)dx<0?nextSlide():prevSlide();});

setTimeout(()=>{document.getElementById('hint').style.opacity='0';},5000);

function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
</script>
</body>
</html>
